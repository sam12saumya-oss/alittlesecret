<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Harpreet & Saumya — Wedding Celebration</title>
  
  <meta property="og:title" content="Harpreet & Saumya — We're Getting Married! 🥂✨" />
  <meta property="og:description" content="Join us for our wedding celebrations from January 17th to 19th, 2027 in Greater Noida." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#E29CA5" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastelrose: '#F5B6B0',
            dustyrose: '#D8878F',
            softmauve: '#633B48',
            deepslate: '#2D2226',
            pastelblush: '#FAF2EE',
            pastelsage: '#DCE8DE',
            pastelyellow: '#FBF2D5',
            pastelpeach: '#FCE8DE',
            softgold: '#C5A059',
            rosegold: '#C98B7A'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            script: ['"Great Vibes"', 'cursive']
          }
        }
      }
    }
  </script>

  <style>
    .bg-cute-polka {
      background-color: #FAF6F3;
      background-image: radial-gradient(#E8D9D4 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* 3D Envelope Perspective */
    .envelope-perspective {
      perspective: 1600px;
    }

    .envelope-box {
      background: linear-gradient(145deg, #F5C5CA 0%, #EAA2AC 50%, #D88994 100%);
      box-shadow: 0 35px 80px -15px rgba(120, 50, 65, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }

    /* Flaps */
    .flap-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54%;
      background: linear-gradient(180deg, #F8CCD1 0%, #E79CA6 100%);
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      transform-origin: top center;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s ease 0.4s;
      z-index: 25;
      filter: drop-shadow(0 6px 8px rgba(100, 30, 45, 0.18));
    }
    .flap-top.open {
      transform: rotateX(180deg);
      z-index: 5;
    }

    .flap-left {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #F4B8C1 0%, #E298A3 100%);
      clip-path: polygon(0% 0%, 0% 100%, 52% 50%);
      z-index: 15;
    }

    .flap-right {
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, #F4B8C1 0%, #E298A3 100%);
      clip-path: polygon(100% 0%, 100% 100%, 48% 50%);
      z-index: 15;
    }

    .flap-bottom {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #DEA0A9 0%, #E895A0 100%);
      clip-path: polygon(0% 100%, 100% 100%, 50% 48%);
      z-index: 16;
    }

    .envelope-letter {
      transition: transform 1.1s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.5s ease;
      z-index: 8;
    }
    .envelope-letter.sliding-out {
      transform: translateY(-60%) scale(1.05);
    }

    .wax-seal-btn {
      background: radial-gradient(circle at 35% 30%, #FFF1EC 0%, #D47B85 55%, #8F3845 100%);
      box-shadow: 
        0 14px 30px rgba(99, 29, 44, 0.5), 
        inset 0 2px 4px rgba(255, 255, 255, 0.9), 
        inset 0 -3px 6px rgba(80, 20, 32, 0.6);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wax-seal-btn:hover {
      transform: scale(1.08) rotate(3deg);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 0.25; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .seal-ring-anim {
      animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    #revealOverlay {
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s ease;
    }
    #revealOverlay.unveiled {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.03);
    }

    .card-elevated {
      box-shadow: 0 16px 40px -12px rgba(180, 110, 125, 0.15), 0 4px 16px rgba(0, 0, 0, 0.02);
    }
  </style>
</head>

<body class="bg-cute-polka antialiased text-deepslate selection:bg-pastelrose/30 selection:text-softmauve min-h-screen">

  <!-- BACKGROUND MUSIC (2 States - Mast Magan Instrumental Soundtrack) -->
  <audio id="weddingMusic" loop preload="auto" playsinline>

  </audio>

  <!-- ELEGANT ENVELOPE OPENING OVERLAY -->
  <div id="revealOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/65 backdrop-blur-md select-none overflow-hidden">
    
    <div class="envelope-perspective relative w-full max-w-[370px] sm:max-w-[430px] flex flex-col items-center">

      <!-- Envelope Box -->
      <div id="envelopeContainer" class="envelope-box relative w-full aspect-[16/11] rounded-2xl overflow-visible border border-white/50 shadow-2xl flex items-center justify-center">
        
        <!-- Interior Background Pocket -->
        <div class="absolute inset-2 bg-[#F7D2D8] rounded-xl z-0"></div>

        <!-- Inner Letter Card: ONLY SHOWS "Together with our families" -->
        <div id
